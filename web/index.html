<html lang="de">
<head>
    <meta charset="utf-8">
    <title>LiveView Engine</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1f24;
            color: #e6e6e6;
            margin: 0;
            padding: 24px;
        }
        h1 { font-size: 18px; color: #9fd3ff; font-weight: 600; }

        .status { font-size: 14px; color: #9aa4b2; min-height: 20px; }
        button {
            background: #3a6ea5; color: white; border: none; border-radius: 6px;
            padding: 6px 14px; cursor: pointer; font-size: 13px;
        }
        button:hover { background: #4a7fb8; }
    </style>
